# Build the native (hand-written SwiftUI) iOS app and package it as an
# unsigned IPA. This is the only IPA path: the IPA comes from the Xcode
# project in xcode/ — the SwiftUI host app the user actually opens.
# The old converter-template flow (Apple's safari-web-extension-converter
# template host app) was removed in the 2026-11-20 clean rebuild; the
# converter itself is still usable by hand if ever needed:
#   xcrun safari-web-extension-converter extension/dist \
#     --project-location /tmp/openmonkey-converter --app-name OpenMonkey --swift --no-open
#
# Notes:
# - The build is unsigned (CODE_SIGNING_ALLOWED=NO). The app's App
#   Groups entitlement is therefore not applied at build time; on a
#   device the app falls back to its own Documents/Scripts folder
#   (ScriptStore's built-in fallback) until it is signed with a team
#   that has the group.com.openmonkey.safari App Group.
# - extension/dist is generated by `npm run build` and is not in git;
#   the project's "Build Web Extension" script phase rebuilds it when
#   it is missing, and this workflow builds it explicitly first.
# - The macOS app target is built by Xcode but is not packaged here;
#   a macOS Safari Web Extension target does not exist yet.

name: Build native IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'xcode/**'
      - 'extension/**'
      - 'scripts/generate-icons.py'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-ipa-native.yml'

jobs:
  build-native-ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web extension dependencies
        run: npm ci

      - name: Install Pillow for icon generation
        # macOS runners use a Homebrew Python protected by PEP 668, so a
        # plain `pip install` is refused; --break-system-packages is the
        # documented escape hatch for CI use.
        run: python3 -m pip install --break-system-packages pillow

      - name: Generate app icons
        run: python3 scripts/generate-icons.py

      - name: Build web extension
        run: npm run build

      - name: Build iOS app (unsigned)
        run: |
          xcodebuild \
            -project xcode/OpenMonkey.xcodeproj \
            -scheme OpenMonkey \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Verify the built app
        run: |
          APP="build/derived/Build/Products/Release-iphoneos/OpenMonkey.app"
          echo "== Derived products =="
          find build/derived/Build/Products -maxdepth 2 | head -50
          if [ ! -d "$APP" ]; then
            echo "MISSING app bundle: $APP"
            exit 1
          fi
          echo "== App bundle contents =="
          ls -R "$APP" | head -120
          check() {
            if [ ! -e "$1" ]; then echo "MISSING: $1"; exit 1; fi
          }
          # The embedded Safari Web Extension, with the built web files.
          check "$APP/PlugIns/OpenMonkeyExtension.appex"
          check "$APP/PlugIns/OpenMonkeyExtension.appex/manifest.json"
          check "$APP/PlugIns/OpenMonkeyExtension.appex/popup.html"
          check "$APP/PlugIns/OpenMonkeyExtension.appex/pages.html"
          # The host app's icon (compiled into Assets.car on modern Xcode,
          # or a loose AppIcon PNG on older layouts).
          if [ ! -f "$APP/AppIcon60x60@2x.png" ] && [ ! -f "$APP/Assets.car" ]; then
            echo "MISSING: app icon (neither AppIcon60x60@2x.png nor Assets.car)"
            exit 1
          fi
          echo "Verify OK"

      - name: Package unsigned IPA
        run: |
          APP="build/derived/Build/Products/Release-iphoneos/OpenMonkey.app"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          ditto -c -k --keepParent Payload OpenMonkey-native-unsigned.ipa
          ls -la OpenMonkey-native-unsigned.ipa
          shasum -a 256 OpenMonkey-native-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenMonkey-native-unsigned
          path: OpenMonkey-native-unsigned.ipa
          retention-days: 7
